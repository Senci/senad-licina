# Builds the site and uploads dist/site/ to Cloudflare Pages on every push to master.
# Setup (secrets and variables): README.md, section Deploy.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium-headless-shell
      - run: bun run pdf && bun run site
      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CLOUDFLARE_PROJECT != '' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/site --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=${{ vars.CLOUDFLARE_BRANCH || 'main' }} --commit-dirty=true
