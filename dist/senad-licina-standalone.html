:root {
  --paper: #D9D5D0;      /* the studio backdrop */
  --paper-2: #CCC7C1;
  --ink: #191B14;
  --ink-soft: #4B4D44;
  --olive: #4A5632;      /* the shirt */
  --line: rgba(25, 27, 20, .22);
  --hot: #5B2BE0;        /* the only hint of the second layer */
  --cool: var(--olive);
  --note: transparent;

  --display: "Anton", "Haettenschweiler", "Impact", sans-serif;
  --text: "Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pad: clamp(1.25rem, 4vw, 4rem);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}

[data-uv="on"] {
  --paper: #10062A;
  --paper-2: #1B0C40;
  --ink: #EEE8FF;
  --ink-soft: #B7A9E6;
  --olive: #C8FF2E;      /* fluorescent lime */
  --line: rgba(200, 255, 46, .28);
  --hot: #FF3EC8;
  --cool: #37E8FF;
  --note: #FF3EC8;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 1.125rem/1.55 var(--text);
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-underline-offset: .18em; text-decoration-thickness: .08em; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1; letter-spacing: .005em; }
h2 { font-size: clamp(2.4rem, 6vw, 5rem); max-width: 16ch; text-wrap: balance; }
p { margin: 0 0 1em; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--hot); outline-offset: 3px; }

.wrap { padding-inline: var(--pad); max-width: 92rem; margin-inline: auto; }
.lede { font-size: clamp(1.15rem, 1.6vw, 1.4rem); max-width: 38em; color: var(--ink-soft); margin-top: 1.2rem; }

.skip { position: absolute; left: -999px; top: 0; background: var(--ink); color: var(--paper); padding: .6rem 1rem; z-index: 100; }
.skip:focus { left: 0; }

/* ----------------------------------------------------------- top bar */
.top {
  position: fixed; inset: 0 0 auto 0; z-index: 20;
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  padding: .9rem var(--pad);
  background: color-mix(in srgb, var(--paper) 82%, transparent);
  backdrop-filter: blur(10px);
}
.top__name { font-family: var(--display); font-size: 1.25rem; text-decoration: none; letter-spacing: .02em; }
.top__id { display: flex; align-items: baseline; gap: .6rem; min-width: 0; white-space: nowrap; }
.top__sec { font-family: var(--display); font-size: 1.25rem; letter-spacing: .02em; color: var(--olive); text-decoration: none; }
.top__sec::before { content: "/"; margin-right: .6rem; color: var(--ink-soft); }
.top__sec.swap { animation: swap .35s var(--ease) both; }
/* scroll progress */
.top::after { content: ""; position: absolute; inset: auto 0 0 0; height: 2px; background: var(--olive); transform-origin: left; transform: scaleX(var(--sp, 0)); }
[data-uv="on"] .top::after { box-shadow: 0 0 12px var(--olive); }
.top__nav { display: flex; align-items: center; gap: clamp(.7rem, 2vw, 1.6rem); font-size: .95rem; font-weight: 500; }
.top__nav a { text-decoration: none; padding: .7rem .5rem; margin: -.7rem -.5rem; }
.top__nav a:hover { text-decoration: underline; }

.lang { display: inline-flex; border: 1.5px solid var(--ink); }
.lang button { background: none; border: 0; padding: .2rem .55rem; font-weight: 600; font-size: .85rem; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.uvswitch { display: inline-flex; align-items: center; gap: .5rem; background: none; border: 0; padding: .2rem 0; font-weight: 600; font-size: .9rem; }
.uvswitch__track { width: 2.5rem; height: 1.35rem; border: 1.5px solid var(--ink); border-radius: 99px; position: relative; display: inline-block; transition: background .3s; }
.uvswitch__knob { position: absolute; top: 2px; left: 2px; width: calc(1.35rem - 7px); aspect-ratio: 1; border-radius: 50%; background: var(--hot); transition: transform .35s var(--ease); }
.uvswitch[aria-checked="true"] .uvswitch__knob { transform: translateX(1.15rem); box-shadow: 0 0 12px var(--hot), 0 0 2px #fff; }

/* -------------------------------------------------------------- hero */
.hero {
  position: relative;
  min-height: 100svh;
  display: grid;
  align-items: end;
  padding: 6.5rem var(--pad) 0;
  overflow: hidden;
  border-bottom: 1.5px solid var(--ink);
}
.hero__field { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero__inner { position: relative; z-index: 1; padding-bottom: clamp(2rem, 6vh, 5rem); max-width: 100%; }
.hero__h {
  font-size: clamp(3.4rem, 9.6vw, 11rem);
  line-height: .93;
  margin-bottom: clamp(1.4rem, 3.5vh, 2.6rem);
}
.hero__h .ln { display: block; overflow: hidden; padding-block: .06em; margin-block: -.06em; white-space: nowrap; }
.hero__h .ln > span { display: block; }
.hero__sub { max-width: min(31em, 46vw); font-size: clamp(1.05rem, 1.35vw, 1.3rem); }
.hero__cta { display: flex; flex-wrap: wrap; gap: .8rem; margin: 1.6rem 0 0; }

.hero__portrait {
  position: absolute; z-index: 2; margin: 0;
  right: clamp(-2rem, 1vw, 3rem); bottom: 0;
  width: min(46vw, 82svh);
  pointer-events: none;
}
.hero__portrait img { width: 100%; height: auto; transition: filter .4s; }
[data-uv="on"] .hero__portrait img { filter: url(#uv-tone) contrast(1.08) drop-shadow(0 0 28px rgba(255, 62, 200, .35)); }

/* load sequence: one orchestrated moment */
.intro .hero__h .ln > span { animation: rise .9s var(--ease) both; }
.intro .hero__h .ln:nth-child(2) > span { animation-delay: .09s; }
.intro .hero__h .ln:nth-child(3) > span { animation-delay: .18s; }
.intro .hero__portrait { animation: stand 1.1s var(--ease) .25s both; }
.intro .hero__sub, .intro .hero__cta { animation: fade .8s ease .7s both; }
@keyframes rise { from { transform: translateY(110%); } }
@keyframes stand { from { transform: translateY(12%); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* ----------------------------------------------- hero pin (chaos to order) */
@media (min-width: 801px) and (min-height: 640px) and (prefers-reduced-motion: no-preference) {
  .pin { height: calc(100svh + 70vh); }
  .pin .hero { position: sticky; top: 0; height: 100svh; }
}
.hero__hint { display: none; margin: 1.4rem 0 0; font-size: .85rem; font-weight: 500; color: var(--ink-soft); align-items: center; gap: .5rem; transition: opacity .3s; }
.hero__hint::before { content: ""; width: .7rem; height: .7rem; border-radius: 50%; background: var(--hot); box-shadow: 0 0 10px var(--hot); }
@media (hover: hover) and (pointer: fine) and (min-width: 801px) { .hero__hint { display: flex; } }
[data-uv="on"] .hero__hint { opacity: 0; }

/* ------------------------------------------------- blacklight torch
   A blacklight copy of the page, clipped to a circle around the pointer. */
@property --tr { syntax: "<length>"; inherits: true; initial-value: 0px; }
.uvlayer {
  position: absolute; inset: 0 0 auto 0; z-index: 10; pointer-events: none;
  background: var(--paper); color: var(--ink);
  clip-path: circle(var(--tr) at var(--tx, 50%) var(--ty, 0));
  transition: --tr .3s var(--ease);
}
.uvlayer.on { --tr: 190px; }
.torch { position: fixed; left: -190px; top: -190px; width: 380px; height: 380px; border-radius: 50%; z-index: 11; pointer-events: none; opacity: 0; transition: opacity .3s; box-shadow: 0 0 0 1.5px #C8FF2E, 0 0 46px 4px rgba(200, 255, 46, .4), inset 0 0 70px rgba(255, 62, 200, .22); }
.torch.on { opacity: 1; }
.torching { user-select: none; -webkit-user-select: none; cursor: none; }

/* ------------------------------------------------------------ numbers */
.nums { border-bottom: 1.5px solid var(--ink); }
.nums__grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.num { padding: clamp(1.8rem, 5vh, 3.2rem) clamp(1rem, 2.4vw, 2.4rem); border-left: 1.5px solid var(--line); display: flex; flex-direction: column; gap: .7rem; }
.num:first-child { border-left: 0; padding-left: 0; }
.num b { font-family: var(--display); font-weight: 400; font-size: clamp(3.4rem, 8.5vw, 8rem); line-height: .85; font-variant-numeric: tabular-nums; transition: color .4s, text-shadow .4s; }
.num span { font-size: .98rem; line-height: 1.35; color: var(--ink-soft); max-width: 17em; }
[data-uv="on"] .num:nth-child(4n+1) b { color: var(--olive); text-shadow: 0 0 26px rgba(200, 255, 46, .55); }
[data-uv="on"] .num:nth-child(4n+2) b { color: var(--hot); text-shadow: 0 0 26px rgba(255, 62, 200, .55); }
[data-uv="on"] .num:nth-child(4n+3) b { color: var(--cool); text-shadow: 0 0 26px rgba(55, 232, 255, .55); }
[data-uv="on"] .num:nth-child(4n+4) b { color: #FF9A3D; text-shadow: 0 0 26px rgba(255, 154, 61, .55); }

/* --------------------------------------------- headings rise word by word */
.rise .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding-block: .08em; margin-block: -.08em; }
.rise .w > span { display: inline-block; transform: translateY(110%); transition: transform .7s var(--ease) calc(var(--i) * 45ms); }
.rise.in .w > span { transform: none; }

/* ------------------------------------------------------ ask the stack */
.ask { margin-top: 1.4rem; }
.ask__label { display: block; font-family: var(--display); font-size: 1.25rem; letter-spacing: .02em; margin-bottom: .5rem; }
.ask__row { display: flex; gap: 6px; }
.ask__row input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent; border: 1.5px solid var(--ink); border-radius: 0; padding: .75rem 1rem; }
.ask__row input::placeholder { color: var(--ink-soft); opacity: 1; }
.layer.hit, .rail.hit { background: var(--olive); color: var(--paper); }
.layer.hit small { color: var(--paper); opacity: .8; }
[data-uv="on"] .layer.hit, [data-uv="on"] .rail.hit { background: var(--hot); color: #10062A; box-shadow: 0 0 30px rgba(255, 62, 200, .45); }
[data-uv="on"] .layer.hit small { color: #10062A; }
.ask__q { font-weight: 600; color: var(--ink-soft); overflow-wrap: anywhere; }
.trace { list-style: none; margin: 0 0 1.2rem; padding: 0; counter-reset: hop; }
.trace li { counter-increment: hop; display: grid; grid-template-columns: 1.6rem 8.5rem minmax(0, 1fr); gap: .6rem; padding: .45rem 0; border-bottom: 1px solid var(--line); font-size: .98rem; line-height: 1.35; animation: swap .35s var(--ease) both; }
.trace li::before { content: counter(hop); font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.trace b { font-weight: 600; color: var(--olive); }
.ask__a { font-weight: 500; min-height: 4.6em; }
.ask__a.typing::after { content: ""; display: inline-block; width: .5em; height: 1em; margin-left: .15em; vertical-align: -.15em; background: var(--olive); animation: blink .8s steps(2) infinite; }
@keyframes blink { to { opacity: 0; } }

/* -------------------------------------------------------------- sound */
.snd { display: inline-flex; align-items: center; gap: .4rem; background: none; border: 1.5px solid var(--ink); padding: .3rem .55rem; font-weight: 600; font-size: .85rem; }
.snd[hidden] { display: none; }
.snd[aria-pressed="true"] { background: var(--olive); border-color: var(--olive); color: #10062A; box-shadow: 0 0 18px rgba(200, 255, 46, .5); }
.snd .wave { opacity: .35; }
.snd[aria-pressed="true"] .wave { opacity: 1; }

/* ----------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .75rem 1.15rem;
  border: 1.5px solid var(--ink);
  background: transparent; color: var(--ink);
  font-weight: 600; font-size: 1rem; text-decoration: none;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease);
}
.btn:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--olive); }
.btn:active { transform: none; box-shadow: none; }
.btn--solid { background: var(--ink); color: var(--paper); }
.btn--uv { border-color: var(--hot); color: var(--hot); }
.btn--uv:hover { box-shadow: 4px 4px 0 var(--hot); }

/* ------------------------------------------------------------- icons */
.ico { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: square; }
.ico--brand { width: 1.35rem; height: 1.35rem; fill: currentColor; stroke: none; }
.ico--down .mv { transition: transform .2s var(--ease); }
a:hover > .ico--down .mv, a:focus-visible > .ico--down .mv { transform: translateY(2px); }

/* ------------------------------------------- blacklight-only side notes */
.note {
  position: absolute;
  font: italic 700 clamp(.95rem, 1.3vw, 1.2rem)/1.2 var(--text);
  color: var(--note);
  transform: rotate(-4deg);
  opacity: 0; pointer-events: none; user-select: none;
  transition: opacity .5s .3s;
  white-space: nowrap;
}
[data-uv="on"] .note { opacity: 1; text-shadow: 0 0 14px currentColor; }
.note--hero { right: 0; top: -1.4rem; position: absolute; color: var(--cool); }
.hero__inner { position: relative; }
.note--portrait { left: 30%; top: 74%; transform: rotate(-7deg); color: var(--olive); }
.note--stack { right: 0; bottom: -.5rem; color: var(--cool); transform: rotate(3deg); }
.note--origin { right: 0; bottom: -2.5rem; }
.note--path { right: var(--pad); top: calc(clamp(5rem, 12vh, 9rem) + 1.5rem); color: var(--cool); transform: rotate(4deg); }
.note--talk { right: var(--pad); top: 40%; transform: rotate(-7deg); }

/* ------------------------------------------------------------- stack */
section { position: relative; }
.stack { padding-block: clamp(5rem, 12vh, 9rem); }
.stack__head { position: relative; }
.stack__body {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: clamp(1.5rem, 4vw, 4rem); margin-top: clamp(2rem, 5vh, 3.5rem); align-items: start;
}
.diagram {
  display: grid;
  grid-template-columns: 3.4rem minmax(0, 1fr) 3.4rem;
  grid-template-rows: repeat(5, minmax(4.4rem, auto));
  gap: 6px;
  position: relative;
}
.layer, .rail {
  border: 1.5px solid var(--ink);
  background: transparent;
  text-align: left;
  font-family: var(--display);
  font-size: clamp(1.3rem, 2.2vw, 2rem);
  padding: 0 1.1rem;
  display: flex; align-items: center; justify-content: space-between;
  position: relative; overflow: hidden;
  transition: background .25s, color .25s, transform .25s var(--ease);
}
.layer { grid-column: 2; z-index: 1; }
.layer small { font: 500 .8rem/1.2 var(--text); color: var(--ink-soft); text-align: right; max-width: 55%; text-wrap: balance; transition: color .25s; }
.rail { grid-row: 1 / -1; writing-mode: vertical-rl; justify-content: center; padding: 0; font-size: clamp(1.1rem, 1.6vw, 1.4rem); letter-spacing: .04em; }
.rail--l { grid-column: 1; transform: rotate(180deg); }
.rail--r { grid-column: 3; }
.layer:hover, .rail:hover { background: var(--paper-2); }
.layer[aria-pressed="true"], .rail[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.layer[aria-pressed="true"] small { color: var(--paper); opacity: .75; }
[data-uv="on"] .layer[aria-pressed="true"], [data-uv="on"] .rail[aria-pressed="true"] { background: var(--olive); color: #10062A; box-shadow: 0 0 30px rgba(200, 255, 46, .35); }
[data-uv="on"] .layer[aria-pressed="true"] small { color: #10062A; }

/* tokens travelling up the stack */
.tokens { grid-column: 2; grid-row: 1 / -1; position: relative; pointer-events: none; z-index: 0; overflow: hidden; }
.tokens i {
  position: absolute; bottom: -10px; left: var(--x);
  width: 6px; height: 6px; background: var(--olive);
  animation: climb var(--d) linear var(--delay) infinite;
  mix-blend-mode: difference;
}
[data-uv="on"] .tokens i { background: var(--c, var(--hot)); mix-blend-mode: normal; box-shadow: 0 0 8px var(--c, var(--hot)); }
@keyframes climb { to { transform: translateY(calc(-1 * var(--h, 400px) - 20px)); } }

.detail { position: sticky; top: 6rem; min-height: 16rem; scroll-margin-top: 5rem; }
.detail h3 { font-size: clamp(2.2rem, 4.5vw, 4rem); margin-bottom: 1rem; }
.detail p { max-width: 30em; }
.detail .tech { color: var(--olive); font-weight: 600; font-size: 1rem; border-top: 1.5px solid var(--line); padding-top: .9rem; margin-top: 1.4rem; }
.detail.swap > * { animation: swap .35s var(--ease) both; }
@keyframes swap { from { opacity: 0; transform: translateX(14px); } }

/* ------------------------------------------------------------ origin */
.origin { background: var(--ink); color: var(--paper); padding-block: clamp(4rem, 10vh, 8rem); overflow: hidden; }
[data-uv="on"] .origin { background: var(--paper-2); color: var(--ink); }
.origin__grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(1.5rem, 5vw, 5rem); align-items: center; }
.origin__year {
  font-family: var(--display); font-size: clamp(7rem, 24vw, 24rem); line-height: .8;
  color: transparent; -webkit-text-stroke: 2px currentColor; -webkit-text-stroke-color: var(--paper);
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  padding-block: .12em; margin-block: -.12em;
  --fill: var(--paper);
  background: linear-gradient(to top, var(--fill) calc(var(--fy, 0) * 100%), transparent 0);
  -webkit-background-clip: text; background-clip: text;
}
[data-uv="on"] .origin__year { --fill: var(--olive); -webkit-text-stroke-color: var(--olive); filter: drop-shadow(0 0 18px rgba(200, 255, 46, .5)); }
.origin__text { position: relative; }
.origin__text h2 { margin-bottom: 1.5rem; }
.origin__text p { max-width: 34em; opacity: .86; }

/* -------------------------------------------------------------- path */
.path { padding-block: clamp(5rem, 12vh, 9rem); }
.timeline { position: relative; margin-top: clamp(2rem, 5vh, 4rem); padding-left: clamp(1.4rem, 3vw, 2.5rem); }
.timeline::before, .timeline::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
.timeline::after { background: var(--olive); transform-origin: top; transform: scaleY(var(--p, 0)); }
[data-uv="on"] .timeline::after { box-shadow: 0 0 14px var(--olive); }
.job { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 1rem 2.5rem; padding-block: 1.8rem; border-bottom: 1.5px solid var(--line); position: relative; }
.job::before { content: ""; position: absolute; left: calc(-1 * clamp(1.4rem, 3vw, 2.5rem) - 5px); top: 2.35rem; width: 13px; height: 13px; background: var(--paper); border: 3px solid var(--olive); z-index: 1; transition: background .3s, box-shadow .3s; }
.job.on::before { background: var(--olive); }
[data-uv="on"] .job.on::before { box-shadow: 0 0 14px var(--olive); }
.job__when { font-family: var(--display); font-size: 1.5rem; line-height: 1.2; color: var(--ink-soft); transition: color .3s; }
.job.on .job__when { color: var(--ink); }
.job__org { font-family: var(--display); font-size: clamp(1.6rem, 2.8vw, 2.4rem); }
.job__role { font-weight: 600; color: var(--olive); margin: .25rem 0 .8rem; }
.job ul { margin: 0; padding-left: 1.1em; max-width: 44em; }
.job li { margin-bottom: .45em; }
.job li::marker { color: var(--olive); }
.job--first .job__org { font-size: clamp(2.2rem, 4.5vw, 4rem); }
.earlier { margin-top: 2.5rem; }
.earlier h3 { font-size: 1.8rem; margin-bottom: .8rem; }
.row { display: grid; grid-template-columns: 11rem 16rem minmax(0, 1fr); gap: .3rem 2.5rem; padding-block: .65rem; border-bottom: 1px solid var(--line); font-size: 1rem; }
.row b { font-weight: 600; }
.row span:first-child { font-variant-numeric: tabular-nums; color: var(--ink-soft); }

/* ------------------------------------------------------------- weird */
.weird { padding-block: clamp(5rem, 12vh, 9rem); border-block: 1.5px solid var(--ink); background: var(--paper-2); }
.weird__list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(2rem, 5vw, 4.5rem) clamp(2rem, 6vw, 6rem); margin-top: clamp(2.5rem, 6vh, 4.5rem); }
.odd h3 { font-size: clamp(2.2rem, 5vw, 4.4rem); margin-bottom: .6rem; transition: color .4s, text-shadow .4s; }
.odd p { max-width: 26em; margin: 0; }
.odd--neuro { grid-column: 1 / -1; }
.odd--neuro h3 { font-size: clamp(4rem, 13vw, 12rem); }
.odd--neuro p { font-size: clamp(1.15rem, 1.7vw, 1.45rem); max-width: 30em; }
[data-uv="on"] .odd:nth-child(4n+1) h3 { color: var(--olive); text-shadow: 0 0 26px rgba(200, 255, 46, .55); }
[data-uv="on"] .odd:nth-child(4n+2) h3 { color: var(--hot); text-shadow: 0 0 26px rgba(255, 62, 200, .55); }
[data-uv="on"] .odd:nth-child(4n+3) h3 { color: var(--cool); text-shadow: 0 0 26px rgba(55, 232, 255, .55); }
[data-uv="on"] .odd:nth-child(4n+4) h3 { color: #FF9A3D; text-shadow: 0 0 26px rgba(255, 154, 61, .55); }
.weird__cta { margin: clamp(2.5rem, 6vh, 4rem) 0 0; }

/* -------------------------------------------------------------- talk */
.talk { padding-block: clamp(5rem, 12vh, 9rem); }
.talk__list { list-style: none; padding: 0; margin: clamp(1.5rem, 4vh, 3rem) 0; max-width: 46rem; }
.talk__list li { font-size: clamp(1.2rem, 2vw, 1.6rem); line-height: 1.35; padding: 1rem 0 1rem 2.2rem; border-bottom: 1.5px solid var(--line); position: relative; }
.talk__list li::before { content: "…"; position: absolute; left: 0; color: var(--olive); font-weight: 700; }
.talk__closing { color: var(--ink-soft); margin-top: 2.5rem; }
.talk__mail {
  display: inline-block; font-family: var(--display); text-decoration: none;
  font-size: clamp(2.3rem, 9vw, 9rem); line-height: 1.05;
  background: linear-gradient(var(--olive), var(--olive)) no-repeat 0 100% / 0 .09em;
  transition: background-size .5s var(--ease);
  overflow-wrap: anywhere;
}
.talk__mail:hover, .talk__mail:focus-visible { background-size: 100% .09em; }
[data-uv="on"] .talk__mail { color: var(--olive); text-shadow: 0 0 30px rgba(200, 255, 46, .45); }

.foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .5rem 2rem; padding-block: 1.6rem; border-top: 1.5px solid var(--ink); font-size: .9rem; color: var(--ink-soft); }
.foot__links { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; }
.foot > :last-child { justify-self: end; text-align: right; }
.foot a { display: inline-flex; padding: .6rem .5rem; margin: -.6rem -.5rem; transition: color .2s; }
.foot a:hover, .foot a:focus-visible { color: var(--olive); }

/* ------------------------------------------- blacklight reveal (View Transitions) */
::view-transition-old(root) { animation: none; }
::view-transition-new(root) { animation: uv-reveal .8s cubic-bezier(.7, 0, .2, 1); }
@keyframes uv-reveal { from { clip-path: circle(0 at var(--vx, 90%) var(--vy, 2rem)); } to { clip-path: circle(150vmax at var(--vx, 90%) var(--vy, 2rem)); } }

/* a faint pulse at 145 bpm when the blacklight is on */
[data-uv="on"] .uvswitch__knob { animation: beat calc(60s / 145) ease-out infinite; }
@keyframes beat { from { box-shadow: 0 0 22px 4px var(--hot); } to { box-shadow: 0 0 8px 0 var(--hot); } }

/* ------------------------------------------------------------ mobile */
@media (max-width: 800px) {
  body { font-size: 1.05rem; }
  .top__nav a[href="#talk"], .top__sec { display: none; }
  .uvswitch > span[data-t] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .top { padding-block: .7rem; }
  .hero { padding-top: 5.5rem; align-items: start; }
  .hero__inner { padding-bottom: 0; }
  .hero__sub { max-width: none; }
  .hero__h { font-size: clamp(2.7rem, 14.4vw, 6rem); }
  .hero__cta .btn { flex: 1 1 100%; justify-content: center; }
  .foot { grid-template-columns: 1fr; }
  .foot > :last-child { justify-self: start; text-align: left; }
  .hero__portrait { position: relative; right: auto; width: min(88vw, 26rem); margin: 1.5rem auto 0; }
  .stack__body { grid-template-columns: minmax(0, 1fr); }
  .diagram { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  .layer, .rail { grid-column: 1; grid-row: auto !important; min-height: 3.6rem; }
  .rail { writing-mode: horizontal-tb; transform: none; justify-content: flex-start; padding: 0 1.1rem; font-size: clamp(1.3rem, 2.2vw, 2rem); letter-spacing: .005em; border-style: dashed; }
  .layer small, .tokens { display: none; }
  .detail { position: static; min-height: 0; }
  .diagram .detail { padding: .6rem 0 1.2rem; }
  .diagram .detail h3 { display: none; }
  .trace li { grid-template-columns: 1.4rem minmax(0, 1fr); }
  .trace li span { grid-column: 2; }
  .nums__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .num:nth-child(odd) { border-left: 0; padding-left: 0; }
  .num:nth-child(n+3) { border-top: 1.5px solid var(--line); }
  .snd span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .origin__grid { grid-template-columns: 1fr; }
  .job { grid-template-columns: 1fr; gap: .2rem; }
  .row { grid-template-columns: 1fr; gap: 0; }
  .weird__list { grid-template-columns: 1fr; }
  .note--path, .note--talk, .note--stack { position: static; display: block; margin-top: 1rem; white-space: normal; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .tokens { display: none; }
}

@media (max-width: 480px) {
  #nav-cv { display: none; }
}
</style>

<script>/* Senad Ličina. No framework, no build step. Text lives in content.js. */
(() => {
  const C = window.CONTENT;
  const root = document.documentElement;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mobile = matchMedia("(max-width: 800px)");
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const get = (obj, path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);

  /* ---------------------------------------------------------- language */
  const params = new URLSearchParams(location.search);
  const pick = (l) => ["de", "en"].find((x) => String(l || "").toLowerCase().startsWith(x));
  let lang = pick(params.get("lang")) || pick(navigator.language) || "en";
  let selected = "platform"; // which part of the stack is open
  let uv = false;
  let sec = null; // section named in the top bar
  let jobs = [];

  function render() {
    const t = C[lang];
    root.lang = lang;
    document.title = `${C.meta.name}. ${t.title}, ${C.meta.city}`;

    $$("[data-t]").forEach((el) => {
      const v = get(t, el.dataset.t);
      if (v != null) el.textContent = v;
    });
    // section headings rise word by word when they scroll in
    $$("main h2[data-t]").forEach((h) => {
      h.classList.add("rise");
      h.innerHTML = h.textContent.split(" ").map((w, i) => `<span class="w"><span style="--i:${i}">${esc(w)}</span></span>`).join(" ");
      if (reduced) h.classList.add("in");
      else riseIO.observe(h);
    });
    $$(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

    $("#hero-h").innerHTML = t.hero.headline.map((l) => `<span class="ln"><span>${esc(l)}</span></span>`).join("");
    $("#hero-sub").textContent = t.hero.sub;
    $("#uv2 span").textContent = t.weird[uv ? "ctaOff" : "cta"];
    $("#nums").innerHTML = t.numbers.map((x) => `<div class="num"><b data-n="${Number(x.n)}">${Number(x.n)}</b><span>${esc(x.l)}</span></div>`).join("");
    $("#ask-q").placeholder = t.stack.ask.placeholder;

    const mail = `mailto:${C.meta.email}`;
    $("#cta-mail").href = mail;
    $("#mail").href = mail;
    $("#mail").textContent = C.meta.email;
    $("#cta-cv").href = $("#cta-cv2").href = C.meta.cvFiles[lang];
    $("#nav-cv").href = `cv.html?lang=${lang}`;
    $("#links").innerHTML = C.meta.links.map((l) => `<a href="${esc(l.url)}" rel="me noopener" aria-label="${esc(l.label)}" title="${esc(l.label)}"><svg class="ico ico--brand" viewBox="0 0 24 24" aria-hidden="true"><use href="#b-${esc(l.icon)}"/></svg></a>`).join("");

    renderStack(t);

    $("#origin-text").innerHTML = t.origin.text.map((p) => `<p>${esc(p)}</p>`).join("");

    $("#timeline").innerHTML =
      t.path.jobs
        .map(
          (j, i) => `
        <article class="job${i === 0 ? " job--first" : ""}">
          <div class="job__when">${esc(j.period)}</div>
          <div>
            <h3 class="job__org">${esc(j.org)}</h3>
            <p class="job__role">${esc(j.role)}${j.place ? ", " + esc(j.place) : ""}</p>
            <ul>${j.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
          </div>
        </article>`
        )
        .join("") +
      `<div class="earlier"><h3>${esc(t.path.earlierTitle)}</h3>${t.path.earlier
        .map((e) => `<div class="row"><span>${esc(e.period)}</span><b>${esc(e.org)}</b><span>${esc(e.what)}</span></div>`)
        .join("")}</div>
       <div class="earlier"><h3>${esc(t.education.title)}</h3>${t.education.items
         .map((e) => `<div class="row"><span>${esc(e.period)}</span><b>${esc(e.title)}</b><span>${esc(e.org)}${e.note ? ". " + esc(e.note) : ""}</span></div>`)
         .join("")}</div>`;
    jobs = $$("#timeline .job");

    const odd = (o, cls = "") => `<div class="odd ${cls}"><h3>${esc(o.h)}</h3><p>${esc(o.t)}</p></div>`;
    $("#weird-list").innerHTML = (C.meta.showNeuro ? odd(t.weird.neuro, "odd--neuro") : "") + t.weird.items.map((o) => odd(o)).join("");

    $("#talk-list").innerHTML = t.talk.items.map((i) => `<li>${esc(i)}</li>`).join("");
    measureTokens();
    if (sec) setSection(sec, true);
    onScroll();
  }
  const riseIO = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); riseIO.unobserve(e.target); } }), { threshold: 0.3 });

  /* -------------------------------------------------------- the stack */
  const detail = $("#detail");
  const stackBody = $(".stack__body");
  let askRun = 0; // bumped to cancel a running request animation

  function renderStack(t) {
    askRun++;
    stackBody.append(detail); // it may sit inside the diagram (mobile accordion)
    const d = $("#diagram");
    const [idn, obs] = t.stack.rails;
    d.innerHTML =
      `<button type="button" class="rail rail--l" data-id="${idn.id}">${esc(idn.name)}</button>` +
      t.stack.layers.map((l, i) => `<button type="button" class="layer" style="grid-row:${i + 1}" data-id="${l.id}"><span>${esc(l.name)}</span><small>${esc(l.tech.split(",").slice(0, 2).join(","))}</small></button>`).join("") +
      `<button type="button" class="rail rail--r" data-id="${obs.id}">${esc(obs.name)}</button>` +
      `<div class="tokens" aria-hidden="true">${Array.from({ length: 14 }, (_, i) => {
        const c = ["var(--olive)", "var(--hot)", "var(--cool)"][i % 3];
        return `<i style="--x:${4 + ((i * 37) % 92)}%;--d:${3.2 + (i % 5) * 0.7}s;--delay:${-(i * 0.61).toFixed(2)}s;--c:${c}"></i>`;
      }).join("")}</div>`;
    $$("button", d).forEach((b) => b.addEventListener("click", () => select(b.dataset.id, true)));
    select(selected, false);
  }
  function select(id, animate) {
    askRun++;
    selected = id;
    const t = C[lang].stack;
    const item = [...t.layers, ...t.rails].find((x) => x.id === id) || t.layers[1];
    $$("#diagram button").forEach((b) => { b.classList.remove("hit"); b.setAttribute("aria-pressed", String(b.dataset.id === item.id)); });
    detail.innerHTML = `<h3>${esc(item.name)}</h3><p>${esc(item.text)}</p><p class="tech">${esc(item.tech)}</p>`;
    placeDetail();
    if (animate && !reduced) {
      detail.classList.remove("swap");
      void detail.offsetWidth;
      detail.classList.add("swap");
    }
  }
  // desktop: beside the diagram. mobile: an accordion, directly under the pressed layer
  function placeDetail() {
    const b = mobile.matches && $('#diagram [aria-pressed="true"]');
    if (b) b.after(detail);
    else stackBody.append(detail);
  }
  mobile.addEventListener("change", placeDetail);
  function measureTokens() {
    const tk = $(".tokens");
    if (tk) tk.style.setProperty("--h", tk.offsetHeight + "px");
  }

  // "Ask the stack": a scripted request travels through every layer, then an answer streams back
  const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? 0 : ms));
  $("#ask").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = $("#ask-q");
    const q = input.value.trim();
    if (!q) return;
    const run = ++askRun;
    const t = C[lang].stack;
    const names = Object.fromEntries([...t.layers, ...t.rails].map((x) => [x.id, x.name]));
    const btn = (id) => $(`#diagram [data-id="${id}"]`);
    $$("#diagram button").forEach((b) => { b.classList.remove("hit"); b.setAttribute("aria-pressed", "false"); });
    stackBody.append(detail);
    detail.classList.remove("swap");
    detail.innerHTML = `<h3>${esc(t.ask.title)}</h3><p class="ask__q">&gt; ${esc(q)}</p><ol class="trace"></ol><p class="ask__a"></p>`;
    if (mobile.matches) detail.scrollIntoView({ block: "start", behavior: reduced ? "auto" : "smooth" });
    const trace = $(".trace", detail), ans = $(".ask__a", detail);
    for (const [id, text] of t.ask.steps) {
      await wait(480);
      if (run !== askRun) return;
      btn(id).classList.add("hit");
      trace.insertAdjacentHTML("beforeend", `<li><b>${esc(names[id])}</b><span>${esc(text)}</span></li>`);
    }
    await wait(500);
    ans.classList.add("typing");
    for (const word of t.ask.answer.split(" ")) {
      if (run !== askRun) return;
      ans.append(word + " ");
      await wait(55);
    }
    ans.classList.remove("typing");
    input.value = "";
  });

  /* -------------------------------------------------------- blacklight */
  function setUV(on, ev) {
    const apply = () => {
      uv = on;
      root.dataset.uv = on ? "on" : "off";
      $("#uv").setAttribute("aria-checked", String(on));
      $("#uv2").setAttribute("aria-pressed", String(on));
      $("#uv2 span").textContent = C[lang].weird[on ? "ctaOff" : "cta"];
      $("#snd").hidden = !on;
      if (!on) sound(false);
      if (reduced) requestAnimationFrame(frame);
      $('meta[name="theme-color"]').content = on ? "#10062A" : "#D9D5D0";
      const ico = $('link[rel="icon"]'); // absent in the standalone build
      if (ico) ico.href = `assets/img/favicon${on ? "-uv" : ""}.svg`;
    };
    torchOff();
    if (document.startViewTransition && !reduced) {
      const r = ev && ev.currentTarget ? ev.currentTarget.getBoundingClientRect() : null;
      root.style.setProperty("--vx", (r ? r.left + r.width / 2 : innerWidth - 60) + "px");
      root.style.setProperty("--vy", (r ? r.top + r.height / 2 : 30) + "px");
      document.startViewTransition(apply).finished.catch(() => {}); // an aborted transition still applies the state
    } else apply();
  }
  $("#uv").addEventListener("click", (e) => setUV(!uv, e));
  $("#uv2").addEventListener("click", (e) => setUV(!uv, e));

  $$(".lang button").forEach((b) =>
    b.addEventListener("click", () => {
      lang = b.dataset.lang;
      const p = new URLSearchParams(location.search);
      p.set("lang", lang);
      try { history.replaceState(null, "", "?" + p + location.hash); } catch (_) {}
      render();
    })
  );

  /* ------------------------------------------------------------- torch
     In the calm state, holding the mouse button turns the pointer into a UV lamp:
     a blacklight copy of the page, clipped to a circle around it. */
  const main = $("#main");
  let layer = null, ring = null, ctx2 = null, torch = false, down = null, downTimer = 0, tx = 0, ty = 0;
  function torchOn() {
    if (uv || torch || !down) return;
    torch = true;
    layer = document.createElement("div");
    layer.className = "uvlayer";
    layer.dataset.uv = "on";
    layer.setAttribute("aria-hidden", "true");
    layer.inert = true;
    for (const ch of main.children) layer.append(ch.cloneNode(true));
    $$("[id]", layer).forEach((el) => el.removeAttribute("id"));
    $$("[aria-live]", layer).forEach((el) => el.removeAttribute("aria-live"));
    $$(".swap", layer).forEach((el) => el.classList.remove("swap"));
    const c2 = $("canvas", layer);
    if (c2) { ctx2 = c2.getContext("2d"); ctx2.setTransform(dpr, 0, 0, dpr, 0, 0); }
    ring = document.createElement("div");
    ring.className = "torch";
    document.body.append(layer, ring);
    torchMove(down.x, down.y);
    void layer.offsetWidth;
    layer.classList.add("on");
    ring.classList.add("on");
    root.classList.add("torching");
    getSelection().removeAllRanges();
  }
  function torchMove(x, y) {
    tx = x; ty = y;
    layer.style.setProperty("--tx", x + "px");
    layer.style.setProperty("--ty", y + scrollY + "px");
    ring.style.transform = `translate(${x}px, ${y}px)`;
  }
  function torchOff() {
    clearTimeout(downTimer);
    down = null;
    if (!torch) return;
    torch = false;
    const l = layer, r = ring;
    layer = ring = ctx2 = null;
    l.classList.remove("on");
    r.classList.remove("on");
    root.classList.remove("torching");
    setTimeout(() => { l.remove(); r.remove(); }, reduced ? 0 : 320);
  }
  addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "mouse" || e.button !== 0 || uv) return;
    if (e.target.closest("a, button, input, label, .top")) return;
    down = { x: e.clientX, y: e.clientY };
    downTimer = setTimeout(torchOn, 140); // a plain click does nothing
  });
  addEventListener("pointermove", (e) => {
    if (torch) torchMove(e.clientX, e.clientY);
    else if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) torchOff(); // that is a text selection
  });
  ["pointerup", "pointercancel", "blur", "contextmenu", "dragstart"].forEach((ev) => addEventListener(ev, torchOff));

  /* ------------------------------------------------------------- sound
     Opt-in, blacklight only: a synthesized 145 bpm kick and rolling bass (Web Audio, no file).
     The dot field kicks on the audio clock while it plays. */
  const BEAT = 60 / 145;
  let ac = null, out = null, noise = null, sndOn = false, sndTimer = 0, nextBeat = 0, beatNo = 0, due = [];
  function voice(type, t, f0, f1, fDur, peak, dur, filter) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + fDur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = o;
    if (filter) {
      const lp = ac.createBiquadFilter();
      lp.type = "lowpass"; lp.Q.value = 7;
      lp.frequency.setValueAtTime(filter, t);
      lp.frequency.exponentialRampToValueAtTime(140, t + dur);
      node = o.connect(lp);
    }
    node.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function hat(t) {
    const s = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise;
    hp.type = "highpass"; hp.frequency.value = 7500;
    g.gain.setValueAtTime(0.11, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    s.connect(hp).connect(g).connect(out);
    s.start(t); s.stop(t + 0.06);
  }
  function schedule() {
    while (nextBeat < ac.currentTime + 0.15) {
      voice("sine", nextBeat, 160, 44, 0.1, 0.95, 0.24);
      const note = beatNo % 16 > 13 ? 61.74 : 46.25; // F#1, lifting to B1 at the end of every fourth bar
      for (let i = 1; i < 4; i++) voice("sawtooth", nextBeat + (i * BEAT) / 4, note, 0, 0, 0.42, 0.1, 1100);
      hat(nextBeat + BEAT / 2);
      due.push(nextBeat);
      nextBeat += BEAT;
      beatNo++;
    }
  }
  function sound(on) {
    if (on === sndOn) return;
    sndOn = on;
    $("#snd").setAttribute("aria-pressed", String(on));
    clearInterval(sndTimer);
    if (!on) {
      out.gain.cancelScheduledValues(ac.currentTime);
      out.gain.setTargetAtTime(0, ac.currentTime, 0.04);
      setTimeout(() => { if (!sndOn) ac.suspend(); }, 300);
      return;
    }
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      out = ac.createGain();
      const comp = ac.createDynamicsCompressor();
      out.connect(comp).connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate * 0.06, ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    ac.resume();
    out.gain.cancelScheduledValues(ac.currentTime);
    out.gain.setValueAtTime(0, ac.currentTime);
    out.gain.linearRampToValueAtTime(0.5, ac.currentTime + 0.4);
    due = []; beatNo = 0;
    nextBeat = ac.currentTime + 0.1;
    schedule();
    sndTimer = setInterval(schedule, 25);
  }
  $("#snd").addEventListener("click", () => sound(!sndOn));
  document.addEventListener("visibilitychange", () => { if (document.hidden) sound(false); });

  /* ------------------------------------------------ hero field: chaos and order
     A lattice of points (order). It starts scattered and settles as you scroll
     the pinned hero. A wave of turbulence drifts through it and the pointer
     disturbs it. Under blacklight the balance tips. */
  const cv = $("#field");
  const ctx = cv.getContext("2d");
  const hero = $(".hero");
  const pin = $(".pin");
  const UVCOLS = ["#C8FF2E", "#FF3EC8", "#37E8FF"];
  let W = 0, H = 0, dpr = 1, pts = [], mx = -9999, my = -9999, running = true, lastBeat = 0, boot = reduced ? 0 : 1;

  function build() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = hero.clientWidth; H = hero.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const gap = W < 700 ? 22 : 30;
    pts = [];
    for (let y = gap / 2; y < H; y += gap)
      for (let x = gap / 2; x < W; x += gap) {
        // scattered start: the lattice has to be earned
        const sx = boot ? x + (Math.random() - 0.5) * 220 : x, sy = boot ? y + (Math.random() - 0.5) * 220 : y;
        pts.push({ hx: x, hy: y, x: sx, y: sy, vx: 0, vy: 0, k: (Math.random() * 3) | 0, c: 0 });
      }
  }

  function frame(t) {
    if (running) {
      ctx.clearRect(0, 0, W, H);
      const base = Math.max(uv ? 0.55 : 0, boot);
      const wave = ((t * 0.00007) % 1.7) - 0.35;
      let kick = 0;
      if (sndOn) { while (due.length && due[0] <= ac.currentTime) { due.shift(); kick = 1.6; } }
      else if (uv && t - lastBeat > 60000 / 145) { lastBeat = t; kick = 1.6; }
      const cols = uv ? UVCOLS : ["#191B14", "#4A5632", "#191B14"];
      const calm = 1 - boot * 0.85; // while scattered: weak pull home, fainter dots so the headline stays readable
      ctx.globalCompositeOperation = uv ? "lighter" : "source-over";
      for (let k = 0; k < 3; k++) {
        ctx.fillStyle = cols[k];
        for (const p of pts) {
          if (p.k !== k) continue;
          const u = (p.hx / W) * 0.75 + (p.hy / H) * 0.25;
          const dw = (u - wave) / 0.11;
          const dx = p.x - mx, dy = p.y - my;
          let c = base + Math.exp(-dw * dw) * 0.9 + Math.exp(-(dx * dx + dy * dy) / 16000) * 1.2;
          if (c > 1) c = 1;
          p.c += (c - p.c) * 0.08;
          const a = Math.sin(p.x * 0.006 + t * 0.0004) * Math.cos(p.y * 0.007 - t * 0.0003) * 6.283;
          const pull = (0.012 + 0.07 * (1 - p.c)) * calm;
          p.vx = (p.vx + Math.cos(a) * p.c * 0.42 + (p.hx - p.x) * pull) * 0.9;
          p.vy = (p.vy + Math.sin(a) * p.c * 0.42 + (p.hy - p.y) * pull) * 0.9;
          if (kick) { const ex = p.x - W * 0.5, ey = p.y - H * 0.55, d = Math.hypot(ex, ey) + 1; p.vx += (ex / d) * kick; p.vy += (ey / d) * kick; }
          p.x += p.vx; p.y += p.vy;
          const s = 1.5 + p.c * 1.9 * (1 - boot * 0.6);
          ctx.globalAlpha = uv ? 0.35 + p.c * 0.55 : 0.26 + p.c * 0.5 * (1 - boot * 0.7);
          ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
        }
      }
      ctx.globalAlpha = 1;
      if (ctx2) { // the torch copy shows the same field in blacklight inks
        ctx2.clearRect(0, 0, W, H);
        ctx2.globalCompositeOperation = "lighter";
        for (let k = 0; k < 3; k++) {
          ctx2.fillStyle = UVCOLS[k];
          for (const p of pts) {
            if (p.k !== k) continue;
            const s = 1.5 + p.c * 1.9;
            ctx2.globalAlpha = 0.45 + p.c * 0.45;
            ctx2.fillRect(p.x - s / 2, p.y - s / 2, s, s);
          }
        }
      }
    }
    if (!reduced) requestAnimationFrame(frame);
  }

  hero.addEventListener("pointermove", (e) => { const r = hero.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; });
  hero.addEventListener("pointerleave", () => { mx = my = -9999; });
  new IntersectionObserver(([e]) => { running = e.isIntersecting; }).observe(hero);

  /* ------------------------------------------------- scroll-linked bits */
  const tl = $("#timeline");
  const secEl = $("#sec");
  const yearEl = $("#year");
  const secs = ["stack", "origin", "path", "weird", "talk"].map((id) => document.getElementById(id));
  function onScroll() {
    // hero: chaos settles into order over the pinned stretch (or the first half screen where it is not pinned)
    if (!reduced) {
      const span = pin.offsetHeight - hero.offsetHeight;
      const k = clamp(scrollY / (span > 40 ? span * 0.85 : innerHeight * 0.5));
      boot = (1 - k) * (1 - k);
    }
    // timeline: the line grows, markers and years light up as it passes them
    const r = tl.getBoundingClientRect();
    const p = clamp((innerHeight * 0.6 - r.top) / r.height);
    root.style.setProperty("--p", p.toFixed(4));
    const lineY = r.top + p * r.height;
    jobs.forEach((j) => j.classList.toggle("on", j.getBoundingClientRect().top + 38 < lineY));
    // 2012 fills from the bottom while it crosses the screen
    root.style.setProperty("--fy", clamp((innerHeight * 0.92 - yearEl.getBoundingClientRect().top) / (innerHeight * 0.6)).toFixed(3));
    root.style.setProperty("--sp", clamp(scrollY / Math.max(1, root.scrollHeight - innerHeight)).toFixed(4));
    const cur = secs.filter((s) => s.getBoundingClientRect().top < innerHeight * 0.4).pop();
    setSection(cur ? cur.id : null);
    if (torch) torchMove(tx, ty);
  }
  function setSection(id, force) {
    if (id === sec && !force) return;
    sec = id;
    secEl.hidden = !id;
    if (!id) return;
    secEl.textContent = C[lang].sections[id];
    secEl.href = "#" + id;
    if (!reduced && !force) { secEl.classList.remove("swap"); void secEl.offsetWidth; secEl.classList.add("swap"); }
  }
  addEventListener("scroll", onScroll, { passive: true });

  // run fn(k) with k easing from 0 to 1
  function tween(dur, fn) {
    const t0 = performance.now();
    (function tick(now) {
      const k = clamp((now - t0) / dur);
      fn(1 - Math.pow(1 - k, 3));
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
  }
  const once = (el, threshold, fn) =>
    new IntersectionObserver(([e], io) => { if (e.isIntersecting) { io.disconnect(); if (!reduced) fn(); } }, { threshold }).observe(el);
  // the year rewinds from today to 2012
  once(yearEl, 0.5, () => { const from = new Date().getFullYear(); tween(1500, (k) => { yearEl.textContent = Math.round(from + (2012 - from) * k); }); });
  // the numbers count in (zero counts down)
  once($("#nums"), 0.4, () =>
    tween(1200, (k) => $$("#nums b").forEach((b) => { const n = +b.dataset.n, from = n ? Math.max(0, n - 24) : 12; b.textContent = Math.round(from + (n - from) * k); }))
  );

  /* --------------------------------------------------------------- go */
  render();
  if (params.has("uv")) setUV(true);
  build();
  onScroll();
  document.body.classList.add("intro");
  setTimeout(() => document.body.classList.remove("intro"), 2600);
  requestAnimationFrame(frame);
  let rz;
  addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { torchOff(); build(); measureTokens(); onScroll(); if (reduced) requestAnimationFrame(frame); }, 150); });
})();
</script>
</body>
</html>
